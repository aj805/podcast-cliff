version: '3'

services:
  datadog:
    image: datadog/agent:latest
    environment:
      - DD_API_KEY=your_datadog_api_key
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - default

networks:
  default:
    driver: bridge